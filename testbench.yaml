laravel: '@testbench'

providers:
 - Workbench\App\Providers\WorkbenchServiceProvider
 - N3XT0R\LaravelWebdavServer\WebdavServerServiceProvider

migrations:
  - vendor/n3xt0r/laravel-webdav-server/database/migrations
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/admin/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
    config: true
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
